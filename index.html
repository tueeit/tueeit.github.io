84.3 33.6 127.2 65.9 86.2C102.2 40.1 156.2 16.5 226.4 16h.3c70.3 .5 124.9 24 162.3 69.9c18.4 22.7 32 50 40.6 81.7l-40.4 10.8c-7.1-25.8-17.8-47.8-32.2-65.4c-29.2-35.8-73-54.2-130.5-54.6c-57 .5-100.1 18.8-128.2 54.4C72.1 146.1 58.5 194.3 58 256c.5 61.7 14.1 109.9 40.3 143.3c28 35.6 71.2 53.9 128.2 54.4c51.4-.4 85.4-12.6 113.7-40.9c32.3-32.2 31.7-71.8 21.4-95.9c-6.1-14.2-17.1-26-31.9-34.9c-3.7 26.9-11.8 48.3-24.7 64.8c-17.1 21.8-41.4 33.6-72.7 35.3c-23.6 1.3-46.3-4.4-63.9-16c-20.8-13.8-33-34.8-34.3-59.3c-2.5-48.3 35.7-83 95.2-86.4c21.1-1.2 40.9-.3 59.2 2.8c-2.4-14.8-7.3-26.6-14.6-35.2c-10-11.7-25.6-17.7-46.2-17.8H227c-16.6 0-39 4.6-53.3 26.3l-34.4-23.6c19.2-29.1 50.3-45.1 87.8-45.1h.8c62.6 .4 99.9 39.5 103.7 107.7l-.2 .2zm-156 68.8c1.3 25.1 28.4 36.8 54.6 35.3c25.6-1.4 54.6-11.4 59.5-73.2c-13.2-2.9-27.8-4.4-43.4-4.4c-4.8 0-9.6 .1-14.4 .4c-42.9 2.4-57.2 23.2-56.2 41.8l-.1 .1z"></path></svg></a></div></footer><span></span></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"newsList":[{"content":"\n今日關注勞權、環境的工會、公民團體等齊聚在台積電股東會外日開記者會，電資工會亦到場聲援。\n\n關於近期引起員工們不平的分紅問題，我們希望台積電能正面回應，是否尊重員工組織工會的權益。\n\n在場外開完記者會後，本會的代表亦透過委託進入股東會，與一同前來的工作傷害受害人協會、台灣健康空氣行動聯盟、台灣樹人會等團體登記發言，負責接洽的工作人員表示可以發言，然而錯愕的是，當其他團體發完言，輪到電資工會時，魏哲家董事長突然就宣布股東會結束了。\n\n工會的發言被卡掉，幾個團體趕緊上前與負責的葉資深經理討說法，他當場拿出發言順序表，表示有安排，但不知道為何魏董突然做了這個決定。我們幾個團體合理懷疑，工會在發言單上寫的「恢復分紅比例、員工組織工會」，或許就是台積電魏董讓會議嘎然而止的原因了。\n\n以下是本會何理事準備的發言稿，沒能在股東會上發言十分可惜，全文如下：\n\n『各位 董事、股東，特別是裡面既是股東也是員工夥伴，大家好，這裡是 台灣電子電機資訊產業工會，簡稱電資工會，我是理事何志元。\n今天，代表 職安、勞權、供應鏈人權與棲地保育的團體們，齊聚在台積電股東會。是因為我們認為，台積電做為護國神山，不能只看 產能、股價與獲利，相反地，還有許多需要改善的空間，與回應社會質疑的地方。\n近期，台積電展開 2025年員工分紅，員工們發現 分紅比率 從12%降到10％。賺錢了，分的反而變少？既然這樣，那幹嘛還賣肝、拋家、棄子，來超時工作呢？感到不平的員工，已經開始「準時下班運動」了。\n\n在分紅議題上，電資工會呼籲台積電 兩件事：\n\n一，是台積電應恢復往年的分紅比例。就像電影講的：「丐幫興不興盛，不是我幫主決定，而是你皇帝決定的」。台積電若不恢復分紅，只會累積員工的怨念，到時候誰幫股東、董事會賺錢？\n\n反過來講，勞工如果不給壓力，資方怎麼願意放開啣在嘴上的肥肉？所以我們提出第二個呼籲。\n\n第二個呼籲是，台積電應正面表態，尊重員工組織工會的權力。組不組工會，是勞工的事，台積電資方不該放話說「公司不鼓勵組織工會」、說「工會會影響公司的energy」。\n\n台積電的員工們，也應該趁這個勢頭，把工會組織起來，將個別員工的不平之聲，團結成集體的談判力量，要資方把該給的，通通吐出來。\n\n各位！這次資方 可以砍大家的分紅，如果沒有反應，下次就會不只兩趴。因為公司章程只寫「要發1%以上」，但是要給多少，純看董事會的心情，跟賺不賺錢無關。\n\n看看三星！如果有工會，就可以爭取合理的分配；如果沒有，就等著慢慢被人宰割。這兩者，你要選哪一個？\n\n如果您對工會有任何問題，或是想組工會，卻不知如何進行，都歡迎與 電資工會來聯繫，我們將盡力 為您協助大家。』\n\n今日一同到場的團體們，大家加油：\n\n- 工傷協會\n- 台灣健康空氣行動聯盟\n- RCA員工關懷協會\n- 桃園市產業總工會 \n- 台灣樹人會 \n- 大地心環境關懷協會\n- 新竹公民行動聯盟","data":{"title":"被卡掉的股東會發言","createdAt":"2026-06-05"},"filePath":"20260605.mdx"},{"content":"\n罷工，逼使資方妥協，爭取更高的利潤分配。旋即與之鮮明對比的是台積電分紅開獎，往年12％的利潤分配，被砍成10％，算下來一年可能會少五到六個月的底薪。既然分紅減少，為什麼還要燃燒健康超時工作，下午五點半剪刀門口大排長龍，準時下班運動開始。\n\n在魏哲家總裁親上火線的說明會裡，他向同仁說明因為公司營收看漲，每年分紅還是會增加，但是分紅太多的話社會觀感不佳，所以需要進行分紅控制。挪用的2％利潤，會用在企業社會責任（ESG）計畫、永續經營與對抗景氣循環中。\n\n基層同仁普遍感到不平，資方以企業社會責任與永續經營為包裝，實質上卻是單方面設下分紅天花板，轉嫁經營成本。慷他人之慨拿員工的分紅做公益？公司獲利能成長那麼快，股民賺飽，靠的是員工，沒有員工哪來高階主管們每年翻倍再翻倍的酬金。基層分紅減碼，處長級以上主管為什麼分紅依舊，這就是直接的資源掠奪行為。\n\n請台積電員工們組織起來，組織工會！\n\n過去的經驗，每當出現這種待遇遭受損害的狀況，除了「不爽不要做」之外，我們最常聽到的意見是「工會呢，工會在哪裡？」可見大家也都認為面對這種情況，要依靠工會的集體力量。即使是一個待遇已經夠好的產業，仍然可能因為景氣、技術轉變而對勞動待遇產生影響，需要有足夠力量的工會來與資方進行協商談判。\n\n工會就在各位手上，等著各位組建起來。請大家從匿名社團後面走出來，這樣員工的聲音才能化為集體的力量。這次資方可以砍各位的分紅，大伙兒沒反應，下次就不會只是2％了。畢竟公司章程寫的可是1%以上，給多少純看董事會的心情，如果有工會，可以爭取合理的分配。\n\n2023年時電資工會也曾協助遭遇優離退爭議的華碩員工成立華碩工會，建立工會與公司協商管道，向公司爭取更好的勞動條件。強大且能保障會員權益的工會是需要的，如果你正在嘗試進行組織，歡迎加入電資工會與我們討論。","data":{"title":"電資工會支持台積電員工爭取利潤分配","createdAt":"2026-05-29"},"filePath":"20260529.mdx"},{"content":"\n2025年隨著「紀念日及節日實施條例」的立法，國定假日增加四天。\n這是勞工們自2015年，被砍掉七天國定假日後，努力了近十年獲得的成果。\n\n這樣的改變，對於科技業的勞工，也有不同的意義。\n2015年，雖砍掉七天國定假日，但在科技業中保留七天的休假，供勞工自由運用的狀況亦十分普遍，這些假常被稱作彈性休假。\n\n## 當然，保留七天彈性休假並不是自然而然發生的事情\n\n2015年底，當時也有許多公司要收回彈休的消息。\n電資工會透過「科技業彈休大調查」，工會串連了對彈休有意見的各公司員工，向資方進行施壓，最終科技業有不少公司保留彈休。不敢說工會在這個過程中展現多大的實力，至少當時大家對彈休被收回，是有意見、有情緒的！\n\n### 電資工會訴求\n\n對於現行已實施彈性休假的公司，雖大多數彈性休假始於保留七天假，我們反對因國定假日增加而刪除明年的彈性休假，甚至收回今年的彈性休假。\n\n#### 如果你對彈休調整有所不滿，你可以怎麼做？\n\n1. 協助我們填寫這份調查回報，我們將陸續公布刪除、保留、減少彈性休假的公司名單。\n[彈休調查連結](https://forms.gle/T9TDtM8HpamcCaM9A)\n\n\u003cbr /\u003e\n\n2. 勞動部於七月發函，對於國定假日增加，影響彈休假表示意見認為，「應與工會或個別勞工協商合意後始得為之，不得以修法新增國訂假日為由而片面變更。」如本會會員有意與資方進行彈休協商，歡迎與工會聯繫。（函文）\n\n#### 電資工會認為\n\n- 護國群山大賺錢，我們的肝繼續黑：\n台灣的科技業被譽為「護國群山」賺取大量財富，業界的工時也普遍很長。增加國定假日的消息一出，台積電、聯電則馬上表示要「調整彈休」，業界的其他公司也準備跟進，只顯示護國群山的企業，與一般企業沒什麼不同，一有機會就想要減少勞工們的休假！\n\n\u003cbr /\u003e\n\n- 國定假日與彈休的性質不同，不該加多少天、扣多少天：\n我們認為國定假日不一定放的到假，而彈性休假因為自由排定的性質，比較有可能有實質的休息；對於年資少，特休天數少的同仁，也很需要彈性休假來安排自己的私人事務。國定假日增加不應該被視為彈性休假減少的理由。\n\n\u003cbr /\u003e\n\n- 工時已經很長，不要再讓同仁累趴了：\n台灣整體工時已是亞洲第二長，其中法定「特別休假」與「國定假日」相較其他國家較少，是重要原因之一。既然目前科技業內已有優於法規的彈性休假制度，更不該帶頭限縮，減少行業內同仁休假，這將對整體的勞動條件有負面的效果。\n\n\u003cbr /\u003e\n\u003ciframe src=\"https://docs.google.com/spreadsheets/d/e/2PACX-1vQsgcZ_WaQVVvIascyJq4ba1a36ERas2G47bJTmTECrywI5F-8vcJuacxVe8yfZQr42laolkyeCRbHT/pubhtml?gid=0\u0026amp;single=true\u0026amp;widget=true\u0026amp;headers=false\" width=\"100%\" height=\"1280px\"\u003e\u003c/iframe\u003e\n","data":{"title":"電資工會——科技業各公司「彈性休假」狀況調查！","createdAt":"2025-08-06"},"filePath":"20250806.mdx"},{"content":"\n\n\u003e O編：\n\u003e 在與科技業的同仁接觸的過程中，我們感受到，許多人的職場並不是不存在問題，反而是遇到問題，卻根本不知道有「工會」這樣的手段。我們寫了一些對於組織企業工會的想法，以及如何組織成立工會，分成「上、下」篇刊出，這是上篇，希望能起到拋磚引玉的功用。\n\n![20250207_組織企業工會](/images/20250207/organize-corporate-union1.jpg)\n\n\u003e 狐獴是團結的動物。為了生存，體型嬌小的狐蒙特別團結，當有危險靠近，成年狐蒙會上前保護小朋友，抱著他們或是檔在他們面前。平常也會輪流站崗，一有危險就會儘快通知夥伴。\n\n在快速變化的科技業中，公司往往要求員工保持「靈活」的工作狀態，應對不合理的時程壓力。隨著景氣波動，獎金和分紅時好時壞，不在第一線大公司未必像外界想像得待遇優渥，工時除下去其實也沒有那麼划算。科技業普遍存在工時過長、加班文化以及勞動條件欠佳等等問題。\n\n根據勞動部調查顯示，「專業科學及技術服務業」有 42.9% 勞工要加班*。隨著遠距上班、線上交辦工作等「責任制」職場常態化，「隱形加班」的情況也越來越常見。\n\n常有人說「不爽不要做」，背後的想法是只要能力強，就能談出好條件，自有更好的地方去。但也許有一天會發現，即使能力再強，仍然無法改變不合理的工時和待遇時，藉由組織「企業工會」協助員工爭取更好的權益，凝聚勞工的團結力量可能才是解答。\n\n什麼是企業工會？勞資會議不能解決問題嗎？ 企業工會是一種為爭取勞動權益而組織的團體，能夠透過集體的力量改善職場環境和待遇。工會有團結權、協商權和爭議權，可以合法與公司進行談判，幫助員工爭取更好的工作條件。相較於勞資會議，企業工會的協商權力更大，至少 30 名員工成立企業工會就能促使公司進行協商，公司必須誠信面對，否則會構成不當勞動行為。\n\n企業工會能做什麼？ 工會的主要目的是透過集體力量來保障員工權益，包括加班補償、工時管理、薪資待遇等議題。舉例來說，台北市立動物園企業工會成功爭取加薪、華碩工會成立工會，希望透過協商的方式，與資方處理優離退議題，這些都是工會通過協商取得的成就。此外，工會還可以藉由集體行動在勞資協商中施加壓力，例如依法集體休假或在公司公開活動中表達抗議，以達成更強烈的訴求效果。\n\n科技業工會真的有必要嗎？ 科技業工會的存在對於勞工權益的維護至關重要。科技業員工常面臨裁員、加班等問題，許多人並不了解工會能夠提供幫助，因此有必要加強對工會功能的宣傳和推廣。成立工會不僅能為當前的問題提供解決方案，還能應對未來可能出現的新問題，這種持續性的力量是無法憑藉著個體一己之力達到的。\n\n工會是科技業勞工的後盾 無論是加班補償、工時協商，還是勞動環境的改善，企業工會都能為科技業勞工提供重要的支持和保護。工會的力量來自於團結，只要每個人都能意識到自身的權益，並且願意團結起來，工會就能夠為所有成員創造更好的職場環境。\n\n如果你想組工會，歡迎找電資工會討論！\n\n**下篇：**[不再單打獨鬥！企業工會成立的第一步](/news/20250207-2)","data":{"title":"組織企業工會吧！：團結的力量如何改變你的職場生活？","createdAt":"2025-02-07"},"filePath":"20250207.mdx"},{"content":"\n\n\u003e O編：\n\u003e 在與科技業的同仁接觸的過程中，我們感受到，許多人的職場並不是不存在問題，反而是遇到問題，卻根本不知道有「工會」這樣的手段。我們寫了一些對於組織企業工會的想法，以及如何組織成立工會，分成「上、下」篇刊出，這是下篇，希望能起到拋磚引玉的功用。\n\n![20250207_組織企業工會](/images/20250207/organize-corporate-union2.jpg)\n\n\u003e 狐獴是團結的動物。為了生存，體型嬌小的狐獴特別團結，當有危險靠近，成年狐獴會上前保護小朋友，抱著他們或是檔在他們面前。平常也會輪流站崗，一有危險就會儘快通知夥伴。\n\n對於許多科技業的勞工來說，成立企業工會可能聽起來是一個遙不可及的目標，但其實只要了解相關流程並付出努力，這並非無法實現。本文將簡單介紹成立工會的步驟，以及可能面臨的挑戰和如何克服它們。\n\n\n### 成立工會的基本流程\n第一步是找到至少 30 名願意加入的成員連署即可籌組企業工會，30人是法定最低人數要求。這個過程其實不簡單。一般人在職場上會往來的同事通常滿有限的，要擴大人際網路並找到足夠的發起人需要花費不少時間和努力。電資工會建議，從勞資會議或公司社團活動等機會尋找志同道合的人，是一個有效的起點。\n\n### 克服工會成立過程中的各種挑戰\n例如，公司可能會先發制人，成立受到管理層掌控的「資方工會」。或是管理層明示暗示員工不要參與，以免被標籤為「不合作」員工進而影響到未來職涯發展等等。這些行為都可能構成不當勞動行為，因此必須有所準備。\n\n為了克服這些挑戰，工會的發起人初期或許可以選用匿名平台與潛在成員聯繫，減少員工對暴露身份的擔憂。借助社群平台或線上匿名群組來進行討論，也有助於吸引更多人加入。電資工會在過去協助企業工會成立的經驗，就是透過這樣的匿名方式，從少數成員逐漸擴大規模，最終成功成立。\n\n### 工會日常運作的要點\n工會的工作不僅僅是處理勞資爭議，日常的運作包括舉辦會員團結活動、研究勞動相關議題、以及與公司進行定期協商等，這些日常的工作讓工會與資方爭取權益更有底氣。許多人對工會的印象可能僅限於媒體報導中的抗議或罷工行動等衝突事件，但事實上，大多數工會的工作是在幕後進行的，通過持續不斷的努力來保障會員的權益。\n\n結語：科技業工會的未來 企業工會的成立和運作需要時間與耐心，但它的長期價值是不可忽視的。它不僅可以為當下的勞工權益提供保障，也能為未來的工作環境改善奠定基礎。如果您也希望科技業能夠成為一個更公平、更人性化的工作場所，那麼參與或成立工會將會是非常值得的一步。\n\n如果你想組工會，歡迎找電資工會討論！\n\n\n**上篇：**[組織企業工會吧！：團結的力量如何改變你的職場生活？](/news/20250207)","data":{"title":"不再單打獨鬥！企業工會成立的第一步","createdAt":"2025-02-02"},"filePath":"20250207-2.mdx"}]},"__N_SSG":true},"page":"/","query":{},"buildId":"P4dstYSWsCjA_lx31F0gv","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
